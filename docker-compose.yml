name: sports-betting-ai

services:

  # ─────────────────────────────────────────
  # TimescaleDB (PostgreSQL 16 + extensão time-series)
  # Drop-in replacement do postgres:16 — API e dados 100% compatíveis
  # ─────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: sba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportsbetting}
      POSTGRES_USER: ${POSTGRES_USER:-sba_user}
      # Dev-safe default: evita services falharem quando .env não tem password.
      # Se já tens o volume inicializado com outra password, terás de alinhar
      # o valor no .env ou recriar o volume do postgres.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsbetting}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sba_user} -d ${POSTGRES_DB:-sportsbetting}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sba-network

  # ─────────────────────────────────────────
  # RabbitMQ 3.13 com management UI
  # ─────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sba-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sba_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sba-network

  # ─────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sba-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sba-network

  # ─────────────────────────────────────────
  # C# Data Collector — .NET 10
  # ─────────────────────────────────────────
  data-collector:
    build:
      context: ./src/DataCollector
      dockerfile: DataCollector.Api/Dockerfile
    container_name: sba-collector
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-sportsbetting};Username=${POSTGRES_USER:-sba_user};Password=${POSTGRES_PASSWORD:-sportsbetting}"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: ${RABBITMQ_USER:-sba_rabbit}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbitmq}
      Redis__Url: "redis://redis:6379"
      ApiKeys__FootballData: ${FOOTBALL_DATA_API_KEY}
      ApiKeys__Tennis: ${TENNIS_API_KEY}
      ApiKeys__Odds: ${ODDS_API_KEY}
      InternalApiKey: ${INTERNAL_API_KEY:-dev-api-key-123}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sba-network

  # ─────────────────────────────────────────
  # Python Analysis Engine
  # ─────────────────────────────────────────
  analysis-engine:
    build:
      context: ./src/analysis-engine
      dockerfile: Dockerfile
    container_name: sba-analysis
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # LLM Provider
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Infrastructure
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sportsbetting}
      POSTGRES_USER: ${POSTGRES_USER:-sba_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsbetting}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-sba_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbitmq}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-sba_rabbit}:${RABBITMQ_PASSWORD:-rabbitmq}@rabbitmq:5672/"
      REDIS_URL: "redis://redis:6379"
      # App
      PORT: 8090
      # C# API
      COLLECTOR_API_URL: http://data-collector:8080
      COLLECTOR_API_KEY: ${INTERNAL_API_KEY:-dev-api-key-123}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Use Python (curl is not installed in the slim image) to check the /health endpoint.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health');\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sba-network

  # ─────────────────────────────────────────
  # React Frontend
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        VITE_COLLECTOR_API_URL: http://localhost:8080
        VITE_ANALYSIS_API_URL: http://localhost:8090
        VITE_API_KEY: ${INTERNAL_API_KEY:-dev-api-key-123}
    container_name: sba-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - data-collector
      - analysis-engine
    networks:
      - sba-network

  # ─────────────────────────────────────────
  # Caddy — reverse proxy
  # ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: sba-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - data-collector
      - analysis-engine
    networks:
      - sba-network

# ─────────────────────────────────────────
# Volumes persistentes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ─────────────────────────────────────────
# Rede interna
# ─────────────────────────────────────────
networks:
  sba-network:
    driver: bridge
